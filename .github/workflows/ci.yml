name: Flashcard Generator CI

on:
  push:
    branches:
      - main
      - 'upgrade-*'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test, and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Compile
        run: mvn -B clean compile

      - name: Run Unit Tests
        run: mvn -B test "-Dgroups=!smoke & !acceptance"

      - name: Run Smoke Tests
        run: mvn -B test -Dtest=*SmokeTest

      - name: Run Acceptance Tests
        run: mvn -B test -Dtest=*AcceptanceTest

      - name: Package Application
        run: mvn -B package -DskipTests
