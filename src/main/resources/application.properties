# Application configuration
spring.application.name=flash-card-generator

# Server port (default is 8080)
server.port=8080

# File Upload Limits
# Spring Boot's default is 1MB, which is too small for most PDFs/PPTs.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Redis: Infisical/deployment can provide REDIS_URL; local Docker Desktop falls back to localhost.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Gemini / Spring AI
# Keep gemini.* for the current manual GeminiService and configure Spring AI for the next migration step.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.2
# Keep Spring AI available but do not auto-start its chat client unless explicitly enabled.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}

# Logging level for web requests
logging.level.org.springframework.web=DEBUG
logging.level.com.flashcard=INFO


